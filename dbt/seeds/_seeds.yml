version: 2

seeds:
  - name: xref_decision_ufcstats_fight_overrides
    description: >
      Hand-checked answers for decisions the name match cannot settle. A row with a
      ufcstats_fight_id pins the decision to that fight (ufcstats_fighter_id_1 is the
      UFC Stats fighter who is the decision's fighter 1); a row without one records
      that UFC Stats has no such fight, which takes it out of the match rate's
      denominator. Three rules, as for data/overrides/title_belts.jsonl: an override
      only attaches to a decision and a fight we hold; every row names its source;
      nothing is ever invented to fill a gap.
    config:
      column_types:
        decision_id: varchar
        ufcstats_fight_id: varchar
        ufcstats_fighter_id_1: varchar
        source: varchar
        note: varchar
    columns:
      - name: decision_id
        data_tests:
          - unique
          - not_null
          - relationships: {arguments: {to: ref('cln_mmadecisions_decisions'), field: decision_id}}
      - name: ufcstats_fight_id
        data_tests:
          - relationships: {arguments: {to: ref('cln_ufcstats_fights'), field: ufcstats_fight_id}}
      - name: source
        data_tests: [not_null]

  - name: mmadecisions_deduction_overrides
    description: >
      Point deductions the MMADecisions page gets wrong or leaves out, found by
      mmadecisions_round_scores_valid. A decision with rows here takes these in
      place of the page's (stg_mmadecisions_deductions). fighter_side is the
      decision's fighter order (1 = the winner). Every row names its source, and
      the cards must agree with it: a deduction is never inferred from the cards alone.
    config:
      column_types:
        decision_id: varchar
        round: int
        points: int
        fighter_side: int
        source: varchar
        note: varchar
    columns:
      - name: decision_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('cln_mmadecisions_decisions'), field: decision_id}}
      - name: fighter_side
        data_tests:
          - accepted_values: {arguments: {values: [1, 2]}}
      - name: source
        data_tests: [not_null]

  - name: mmadecisions_round_score_quarantine
    description: >
      Decisions whose per-round scores cannot be squared with what is known of the
      fight, so no round of theirs is a training target. Their totals stand.
    config:
      column_types:
        decision_id: varchar
        source: varchar
        note: varchar
    columns:
      - name: decision_id
        data_tests:
          - unique
          - not_null
          - relationships: {arguments: {to: ref('cln_mmadecisions_decisions'), field: decision_id}}
      - name: source
        data_tests: [not_null]

  - name: news_event_labels
    description: >
      The news gold set: 400 headlines from stg_news_headlines, labelled by hand from
      the headline alone (experiments/news/LABELS.md has the rules and the sample).
      Drafted by Claude, reviewed by the user (reviewed = y). It scores the classifier
      (pipeline/news_classify.py --eval) and the keyword pass's recall.
    config:
      column_types:
        news_url_id: varchar
        stratum: varchar
        site: varchar
        published_date: date
        headline: varchar
        event_type: varchar
        status: varchar
        fighters: varchar
        replaced_fighter: varchar
        opponent: varchar
        event: varchar
        reason: varchar
        reviewed: varchar
    columns:
      - name: news_url_id
        data_tests:
          - unique
          - not_null
          - relationships: {arguments: {to: ref('stg_news_headlines'), field: news_url_id}}
      - name: event_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [withdrawal, replacement, weight_miss, retirement, return, suspension, release,
                         signing, fought_injured, booking, none]
      - name: status
        data_tests:
          - accepted_values: {arguments: {values: [confirmed, speculative, denied]}}
