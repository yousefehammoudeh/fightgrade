version: 2

# Every LANDING table has the same shape: the source record as `payload`,
# plus where it came from and when it was loaded.
anchors:
  - &landing_columns
      - name: payload
        description: The full source row, as loaded from Parquet.
        data_tests: [not_null]
      - name: _object_key
        description: The Parquet file in parsed/ this row came from, relative to the stage.
        data_tests: [not_null]
      - name: _partition_date
        description: The fetch_date partition — the day the source page was fetched.
        data_tests: [not_null]
      - name: _raw_html_key
        description: Object key of the archived HTML page in raw-html/. Null for tables parsed from index pages.
      - name: _file_last_modified
        description: When the Parquet file was written to the bucket.
      - name: _loaded_at
        description: When this row was appended to LANDING.
      - name: _batch_id
        description: dbt invocation that appended this row.

models:
  - name: lnd_tapology_events
    description: Event index listings, one row per event. No archived page, so _raw_html_key is null.
    columns: *landing_columns
  - name: lnd_tapology_event_details
    description: Event pages, one row per event page. Join on payload:event_slug.
    columns: *landing_columns
  - name: lnd_tapology_bouts
    description: One row per bout on a card, parsed from the event page.
    columns: *landing_columns
  - name: lnd_tapology_event_fighters
    description: One row per fighter per bout, including fighters on cancelled and fizzled bouts.
    columns: *landing_columns
  - name: lnd_tapology_bout_details
    description: Title-bout pages, including the 8,101 cancelled title bouts that never reached bouts.
    columns: *landing_columns
  - name: lnd_tapology_fighter_records
    description: >
      Fighter pages (pipeline/tapology_fighters.py), one row per bout on a fetched fighter's
      record, every sport and status. Holds the bouts the event crawl cannot reach: those with
      no event page, and some with no bout page. A bout appears once per fighter fetched;
      join on payload:bout_id.
    columns: *landing_columns
  - name: lnd_tapology_promotions
    description: Promotion index rows (id, slug, name).
    columns: *landing_columns
  - name: lnd_tapology_promotion_details
    description: Promotion pages (headquarters, acronyms, links).
    columns: *landing_columns
  # UFC Stats (pipeline/ufcstats.py). Column names follow the 2026-02/03 export;
  # red/blue_fighter_id are the fight page's first and second fighter, not corners.
  - name: lnd_ufcstats_events
    description: Event pages, one row per completed event, with its card (fight ids, result flags, bonuses).
    columns: *landing_columns
  - name: lnd_ufcstats_fights
    description: Fight pages, one row per fight. Method, details, referee, time format and judges' scores.
    columns: *landing_columns
  - name: lnd_ufcstats_fight_totals
    description: Whole-fight totals, one row per fighter per fight.
    columns: *landing_columns
  - name: lnd_ufcstats_fight_rounds
    description: Per-round totals, one row per fighter per round.
    columns: *landing_columns
  - name: lnd_ufcstats_sig_strikes_by_target
    description: Significant strikes by head/body/leg, per fighter, for round 'totals' and each round.
    columns: *landing_columns
  - name: lnd_ufcstats_sig_strikes_by_position
    description: Significant strikes at distance/clinch/ground, per fighter, for round 'totals' and each round.
    columns: *landing_columns
  - name: lnd_ufcstats_fighters
    description: Fighter pages, refreshed whenever the fighter is on a crawled card.
    columns: *landing_columns
  # MMADecisions (pipeline/mmadecisions.py). Fighters are in page order, winner
  # first (or as listed for a draw); every score pair is (fighter 1, fighter 2).
  - name: lnd_mmadecisions_events
    description: Event pages, one row per event, with each decision's method and the judges' totals as listed.
    columns: *landing_columns
  - name: lnd_mmadecisions_decisions
    description: Decision pages, one row per decision. Event, fighters, result, method, referee, deductions, tale of the tape, fan submissions and fan winner counts.
    columns: *landing_columns
  - name: lnd_mmadecisions_judge_rounds
    description: One row per judge per round. judge_id is null for "Unknown Judge"; a score is null where the site shows "-".
    columns: *landing_columns
  - name: lnd_mmadecisions_judge_totals
    description: One row per judge. totals_kind 'legend' marks early cards whose TOTAL is a code (0-0 unknown, 1-0 favoured, 1-1 draw), not a score.
    columns: *landing_columns
  - name: lnd_mmadecisions_media_scores
    description: One row per media score. Writer, outlet, score, who they had winning, source link.
    columns: *landing_columns
  - name: lnd_mmadecisions_fan_scores
    description: The fan scores the page lists (top finals and top 3 per round), as %, with est_count = % x submissions.
    columns: *landing_columns

  # MMA news (pipeline/news_sitemaps.py): MMA Fighting's and MMA Mania's monthly
  # sitemaps. _raw_html_key is the archived sitemap in raw-xml/news/.
  - name: lnd_news_urls
    description: One row per <url> in a monthly sitemap, as listed on the day it was read. site, url, article_id, url_date (the day in the URL, NULL if it has none), slug, lastmod (the last edit, not publication), sitemap_month.
    columns: *landing_columns

  # English Wikipedia (pipeline/wikipedia_events.py): the Background section of every
  # UFC event article. _raw_html_key is the archived API response in raw-json/wikipedia/.
  # CC BY-SA 4.0: revid and source_url attribute every row to its revision.
  - name: lnd_wikipedia_bout_changes
    description: One row per Background sentence that describes a bout change (withdrawal, replacement, cancellation, bout moved, weight miss) - the pairing before it, withdrawn_fighter, replacement_fighter, reason as written, and citations [{url, title, date, date_iso, website}] whose date is when the change was reported. refers_to_event is set when the sentence is about an earlier booking at another event.
    columns: *landing_columns
