version: 2

# MMA news (pipeline/news_sitemaps.py): the article URLs MMA Fighting and MMA
# Mania list in their monthly sitemaps.
models:
  - name: cln_news_urls
    description: >
      One row per article per site, from its newest sitemap read. news_url_id is
      site:era:article_id. era 'vox' is Vox's numbering (until 2025-08: a dated
      URL or a 7-8 digit id), 'wp' WordPress's (5-6 digit ids, no day in the
      URL). An article moved to a new URL, or whose slug was edited, is kept as
      last listed.
    columns:
      - name: news_url_id
        data_tests: [unique, not_null]
      - name: site
        data_tests:
          - accepted_values: {arguments: {values: [mmafighting, mmamania]}}
      - name: url
        data_tests: [not_null]
