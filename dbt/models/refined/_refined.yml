version: 2

models:
  - name: xref_decision_ufcstats_fight
    description: >
      Which UFC Stats fight each MMADecisions decision is, one to one: the bridge from
      the judges' round scores to the round statistics. ufcstats_fighter_id_1/_2 are
      the UFC Stats fighters in the decision's order (fighter 1 is its winner, or first
      listed for a draw), so score pairs line up. scorecards_agree compares the judges'
      totals on both sites: on 2026-10-27 99% agreed, and all 45 that did not were the
      right fight with a source difference (a judge missing on UFC Stats, one total
      differing, or a majority draw whose odd card UFC Stats prints the other way).
    columns:
      - name: decision_id
        data_tests:
          - unique
          - not_null
          - relationships: {arguments: {to: ref('cln_mmadecisions_decisions'), field: decision_id}}
      - name: ufcstats_fight_id
        data_tests:
          - unique
          - not_null
          - relationships: {arguments: {to: ref('cln_ufcstats_fights'), field: ufcstats_fight_id}}
      - name: ufcstats_fighter_id_1
        data_tests: [not_null]
      - name: ufcstats_fighter_id_2
        data_tests: [not_null]
      - name: match_method
        data_tests:
          - accepted_values:
              arguments: {values: [names, surnames, one_name_and_a_shared_name, one_name, override]}

  - name: xref_decision_ufcstats_fight_match_rate
    description: >
      The fight match's coverage per MMADecisions promotion logo. match_rate is set for
      UFC only, the decisions UFC Stats is expected to have, less those an override
      records as absent.
    columns:
      - name: promotion_logo
        data_tests: [unique]

  - name: fct_ufc_round_stats
    description: >
      One row per fighter per round of every UFC Stats fight: the judge model's
      features (DESIGN.md §8). The counts of cln_ufcstats_fight_rounds, with the
      fight's context, the opponent, round_seconds (the scheduled length, or less for
      the round a finish ended) and non_sig_str_landed (total less significant).
      ctrl_tracked is per fight: UFC Stats prints '--' for control on a whole fight it
      did not track and 0:00 for none, so a NULL ctrl_seconds is never zero.
    data_tests:
      - unique_columns: {arguments: {columns: [ufcstats_fight_id, round, ufcstats_fighter_id]}}
    columns:
      - name: ufcstats_fight_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('cln_ufcstats_fights'), field: ufcstats_fight_id}}
      - name: ufcstats_fighter_id
        data_tests: [not_null]
      - name: ctrl_tracked
        data_tests: [not_null]

  - name: fct_judge_round_score
    description: >
      One row per rater per round of every decision matched to a UFC Stats fight: the
      judge model's target (DESIGN.md §8). A rater is a judge, a hard call, or the
      crowd, the fans' round scores as a distribution weighted by label_weight (the
      fans counted). Fighter A and B are the fight's UFC Stats fighters ordered by id,
      which says nothing about the result. The label is the round score before
      deductions, which MMADecisions' scores include: p_7_10 .. p_10_7 are it as a
      distribution over the seven scores from A's side, margin is A's points less B's
      for judges. exclusion_reason is NULL for a row the model may train on. period
      (select < 2023, forward 2023-24, test 2025+) and cv_fold (0-4, a hash of the
      event id) are the protocol's split, by event.
    data_tests:
      - unique_columns: {arguments: {columns: [ufcstats_fight_id, round, rater_key]}}
    columns:
      - name: ufcstats_fight_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('cln_ufcstats_fights'), field: ufcstats_fight_id}}
      - name: decision_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('xref_decision_ufcstats_fight'), field: decision_id}}
      - name: rater_kind
        data_tests:
          - accepted_values: {arguments: {values: [judge, crowd]}}
      - name: exclusion_reason
        data_tests:
          - accepted_values:
              arguments: {values: [legend_card, quarantined, no_score, invalid_score, no_stats, no_control]}
      - name: period
        data_tests:
          - accepted_values: {arguments: {values: [select, forward, test]}}
      - name: cv_fold
        data_tests:
          - accepted_values: {arguments: {values: [0, 1, 2, 3, 4]}}

  - name: stg_news_headlines
    description: >
      One row per news article on MMA Fighting and MMA Mania: the slug as words
      (headline), the day it was published (published_date; date_source 'url' is
      the day in a Vox URL, 'lastmod' a WordPress URL's last edit), and a loose
      keyword pass. is_candidate marks headlines the classifier reads, and
      candidate_types the keyword families that fired (retirement, withdrawal,
      replacement, weight_miss, suspension, release). It is tuned for recall,
      which the gold set measures.
    columns:
      - name: news_url_id
        data_tests:
          - unique
          - not_null
          - relationships: {arguments: {to: ref('cln_news_urls'), field: news_url_id}}
      - name: published_date
        data_tests: [not_null]
      - name: headline
        data_tests: [not_null]
