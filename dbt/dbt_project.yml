name: fightgrade
version: "1.0.0"
profile: fightgrade

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]

clean-targets: ["target", "dbt_packages"]

vars:
  prod_database: FIGHTGRADE_PROD
  layers: [LANDING, STAGING, CLEANSING, REFINED, PUBLISHED]

models:
  fightgrade:
    # LANDING is append-only, one table per source entity, unfiltered and untyped
    # (DESIGN.md §5). Each run appends only the Parquet files not loaded yet.
    landing:
      +schema: LANDING
      +materialized: incremental
      +incremental_strategy: append
    # CLEANSING is hygiene only: typed, deduplicated to the newest fetch, blanks
    # to NULL, and only the columns something downstream reads. Every row stays —
    # all sports, all levels; scope is applied in REFINED (DESIGN.md §5).
    cleansing:
      +schema: CLEANSING
      +materialized: table
    # STAGING: intermediate models, used sparingly (DESIGN.md §5).
    staging:
      +schema: STAGING
      +materialized: table
    # REFINED: purpose-fit models; scope lives here.
    refined:
      +schema: REFINED
      +materialized: table
    # PUBLISHED: what the front end reads (DESIGN.md §5).
    published:
      +schema: PUBLISHED
      +materialized: table
      # Judge Lens: views over the ML.JUDGE_LENS_* tables the training job writes,
      # built by that job after it publishes (judge_lens_train), not by
      # dbt_prod_build, which runs before it: the tables must exist first.
      judge_lens:
        +materialized: view
        +tags: [judge_lens]

seeds:
  fightgrade:
    # Hand-curated inputs land beside the crawled sources.
    +schema: LANDING
