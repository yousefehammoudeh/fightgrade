# The Judge Lens page's dependencies on Streamlit in Snowflake's container runtime,
# which installs them with uv. The app has no external access integration, so it
# can only use what the runtime ships with: Streamlit and Snowpark (and with them
# pandas and Altair). Unpinned on purpose: pinning a shipped package can fail when
# Snowflake updates the runtime's base image.
[project]
name = "judge-lens"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "streamlit",
    "snowflake-snowpark-python",
]
